<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fun Arena - Ludo</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  background:linear-gradient(135deg,#180b4d,#32147a,#101b4d);
  color:white;
  min-height:100vh;
}

button{
  font-family:inherit;
  cursor:pointer;
}

.header{
  text-align:center;
  padding:18px 10px;
  background:rgba(0,0,0,.25);
}

.logo{
  font-size:28px;
  font-weight:800;
}

.tokens{
  display:inline-block;
  margin-top:8px;
  padding:8px 18px;
  border-radius:20px;
  background:#ffc928;
  color:#251700;
  font-weight:bold;
}

.screen{
  max-width:600px;
  margin:auto;
  padding:18px 12px 40px;
}

.home-title{
  text-align:center;
  margin:10px 0 20px;
  font-size:24px;
}

.games{
  display:grid;
  grid-template-columns:1fr;
  gap:14px;
}

.game-card{
  border:0;
  border-radius:22px;
  padding:22px;
  color:white;
  min-height:130px;
  box-shadow:0 8px 20px rgba(0,0,0,.3);
}

.ludo-card{
  background:linear-gradient(135deg,#ff394d,#a90042);
}

.game-icon{
  font-size:48px;
}

.game-name{
  font-size:23px;
  font-weight:bold;
  margin-top:8px;
}

.game-card small{
  opacity:.9;
}

.hidden{
  display:none!important;
}

.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:12px;
}

.back{
  border:0;
  background:#ffffff20;
  color:white;
  border-radius:12px;
  padding:10px 15px;
}

.turn{
  background:#ffffff18;
  padding:10px 14px;
  border-radius:12px;
  font-weight:bold;
}

.ludo-board{
  width:min(94vw,540px);
  aspect-ratio:1/1;
  margin:auto;
  display:grid;
  grid-template-columns:repeat(15,1fr);
  grid-template-rows:repeat(15,1fr);
  border:4px solid #171717;
  background:white;
  box-shadow:0 12px 30px rgba(0,0,0,.45);
}

.cell{
  border:1px solid #777;
  position:relative;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:10px;
}

.red-zone{
  background:#ff4d5e;
}

.green-zone{
  background:#35d66b;
}

.yellow-zone{
  background:#ffd84a;
}

.blue-zone{
  background:#48a9ff;
}

.path{
  background:#fff;
}

.safe{
  background:#e7e7e7;
  font-size:15px;
}

.center{
  background:conic-gradient(
    #ff4355 0 25%,
    #35d66b 25% 50%,
    #ffd83d 50% 75%,
    #48a9ff 75% 100%
  );
}

.home-dot{
  width:65%;
  height:65%;
  border-radius:50%;
  background:#fff;
  box-shadow:inset 0 0 0 3px #333;
}

.piece{
  width:72%;
  height:72%;
  border-radius:50%;
  border:2px solid #222;
  box-shadow:0 2px 4px #555;
}

.red-piece{background:#e91d3e;}
.green-piece{background:#16a34a;}
.yellow-piece{background:#eab308;}
.blue-piece{background:#1685e5;}

.controls{
  margin-top:18px;
  text-align:center;
}

.dice{
  width:80px;
  height:80px;
  margin:0 auto 12px;
  background:white;
  color:#111;
  border-radius:18px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:45px;
  box-shadow:0 6px 15px #0006;
}

.roll{
  border:0;
  background:#ffd32a;
  color:#241800;
  padding:14px 30px;
  border-radius:25px;
  font-size:18px;
  font-weight:bold;
}

.status{
  margin-top:12px;
  min-height:24px;
  color:#ddd;
}

.players{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-top:15px;
}

.player{
  padding:9px;
  border-radius:12px;
  text-align:center;
  background:#ffffff14;
  font-size:13px;
}

.active{
  outline:2px solid #ffd32a;
}

.new-game{
  margin-top:15px;
  border:0;
  background:#ffffff18;
  color:white;
  padding:11px 20px;
  border-radius:15px;
}

@media(max-width:400px){
  .logo{font-size:24px;}
  .dice{
    width:70px;
    height:70px;
  }
}
</style>
</head>

<body>

<header class="header">
  <div class="logo">🎮 FUN ARENA</div>
  <div class="tokens">🪙 500 Tokens</div>
</header>

<!-- HOME -->
<section id="homeScreen" class="screen">

  <h2 class="home-title">Choose Your Game</h2>

  <div class="games">

    <button class="game-card ludo-card" onclick="startLudo()">
      <div class="game-icon">🎲</div>
      <div class="game-name">Ludo</div>
      <small>Offline • 2-4 Players</small>
    </button>

  </div>

</section>


<!-- LUDO -->
<section id="ludoScreen" class="screen hidden">

  <div class="topbar">
    <button class="back" onclick="goHome()">← Home</button>
    <div class="turn" id="turnText">🔴 Red Turn</div>
  </div>

  <div id="board" class="ludo-board"></div>

  <div class="controls">

    <div id="dice" class="dice">⚀</div>

    <button class="roll" onclick="rollDice()">
      🎲 ROLL DICE
    </button>

    <div id="status" class="status">
      Roll the dice to start!
    </div>

    <div class="players">
      <div id="redPlayer" class="player active">🔴 Red</div>
      <div id="greenPlayer" class="player">🟢 Green</div>
      <div id="yellowPlayer" class="player">🟡 Yellow</div>
      <div id="bluePlayer" class="player">🔵 Blue</div>
    </div>

    <button class="new-game" onclick="newGame()">
      🔄 New Game
    </button>

  </div>

</section>


<script>

const diceFaces = ["⚀","⚁","⚂","⚃","⚄","⚅"];

let currentPlayer = 0;
let lastDice = 0;

const players = [
  {
    name:"Red",
    emoji:"🔴",
    className:"red-piece",
    position:0
  },
  {
    name:"Green",
    emoji:"🟢",
    className:"green-piece",
    position:0
  },
  {
    name:"Yellow",
    emoji:"🟡",
    className:"yellow-piece",
    position:0
  },
  {
    name:"Blue",
    emoji:"🔵",
    className:"blue-piece",
    position:0
  }
];

function startLudo(){

  document.getElementById("homeScreen")
    .classList.add("hidden");

  document.getElementById("ludoScreen")
    .classList.remove("hidden");

  createBoard();
  updateTurn();

}

function goHome(){

  document.getElementById("ludoScreen")
    .classList.add("hidden");

  document.getElementById("homeScreen")
    .classList.remove("hidden");

}

function createBoard(){

  const board = document.getElementById("board");

  board.innerHTML = "";

  for(let row=0; row<15; row++){

    for(let col=0; col<15; col++){

      const cell = document.createElement("div");

      cell.className = "cell";

      /*
        Four home areas
      */

      if(row < 6 && col < 6){
        cell.classList.add("red-zone");
      }

      else if(row < 6 && col > 8){
        cell.classList.add("green-zone");
      }

      else if(row > 8 && col < 6){
        cell.classList.add("blue-zone");
      }

      else if(row > 8 && col > 8){
        cell.classList.add("yellow-zone");
      }

      /*
        Center
      */

      if(row >= 6 && row <= 8 &&
         col >= 6 && col <= 8){

        cell.className = "cell center";

      }

      /*
        Main paths
      */

      if(
        (row >= 6 && row <= 8) ||
        (col >= 6 && col <= 8)
      ){

        cell.classList.add("path");

      }

      /*
        Safe positions
      */

      if(
        (row === 6 && col === 1) ||
        (row === 1 && col === 8) ||
        (row === 8 && col === 13) ||
        (row === 13 && col === 6)
      ){

        cell.classList.add("safe");
        cell.innerHTML = "★";

      }

      board.appendChild(cell);

    }

  }

  addHomeDots();

}

function addHomeDots(){

  const board = document.getElementById("board");

  const positions = [
    [1,1],
    [1,4],
    [4,1],
    [4,4],

    [1,10],
    [1,13],
    [4,10],
    [4,13],

    [10,1],
    [10,4],
    [13,1],
    [13,4],

    [10,10],
    [10,13],
    [13,10],
    [13,13]
  ];

  positions.forEach((pos,index)=>{

    const cell =
      board.children[pos[0]*15 + pos[1]];

    const dot =
      document.createElement("div");

    dot.className="home-dot";

    cell.appendChild(dot);

  });

}

function rollDice(){

  const value =
    Math.floor(Math.random()*6)+1;

  lastDice = value;

  document.getElementById("dice").textContent =
    diceFaces[value-1];

  const player = players[currentPlayer];

  document.getElementById("status").textContent =
    player.emoji+" "+player.name+
    " rolled "+value+"!";

  /*
    Basic movement demo
  */

  player.position += value;

  if(player.position >= 56){

    player.position = 56;

    document.getElementById("status").textContent =
      "🏆 "+player.emoji+" "+player.name+
      " reached the finish!";

  }

  /*
    Six = another turn
  */

  if(value !== 6){

    currentPlayer++;

    if(currentPlayer >= players.length){
      currentPlayer = 0;
    }

  }

  updateTurn();

}

function updateTurn(){

  const player = players[currentPlayer];

  document.getElementById("turnText").textContent =
    player.emoji+" "+player.name+" Turn";

  document.querySelectorAll(".player")
    .forEach(p=>p.classList.remove("active"));

  const ids=[
    "redPlayer",
    "greenPlayer",
    "yellowPlayer",
    "bluePlayer"
  ];

  document.getElementById(ids[currentPlayer])
    .classList.add("active");

}

function newGame(){

  players.forEach(player=>{
    player.position=0;
  });

  currentPlayer=0;
  lastDice=0;

  document.getElementById("dice").textContent="⚀";

  document.getElementById("status").textContent=
    "New game started! Roll the dice.";

  updateTurn();

}

</script>

</body>
</html>
