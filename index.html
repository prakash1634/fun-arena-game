<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>Fun Arena</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  min-height:100vh;
  background:linear-gradient(160deg,#071b55,#063eaa,#3413a5);
  color:white;
}

button{
  border:0;
  cursor:pointer;
  font-weight:bold;
}

.hidden{
  display:none!important;
}

/* HOME */

.home{
  max-width:620px;
  margin:auto;
  padding:10px;
  padding-bottom:80px;
}

.profile{
  background:linear-gradient(90deg,#172078,#321c9b);
  border:2px solid #19bfff;
  border-radius:16px;
  padding:8px;
  display:flex;
  align-items:center;
  gap:10px;
  box-shadow:0 0 15px #008cff;
}

.avatar{
  width:48px;
  height:48px;
  border-radius:50%;
  background:#ffd36a;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:30px;
}

.profile-info{
  flex:1;
  font-size:13px;
}

.level{
  font-size:10px;
  margin-top:3px;
  color:#ddd;
}

.progress{
  width:90px;
  height:6px;
  background:#222;
  border-radius:10px;
  overflow:hidden;
}

.progress span{
  display:block;
  width:55%;
  height:100%;
  background:#28e4ff;
}

.currency{
  display:flex;
  flex-direction:column;
  gap:4px;
}

.coin{
  background:#182c9a;
  border:1px solid #1bc7ff;
  border-radius:12px;
  padding:4px 8px;
  font-size:12px;
}

.top-menu{
  display:grid;
  grid-template-columns:repeat(6,1fr);
  gap:5px;
  margin:8px 0;
}

.small-btn{
  background:linear-gradient(#153a99,#071e63);
  color:white;
  border:1px solid #27aaff;
  border-radius:10px;
  padding:8px 2px;
  font-size:9px;
}

.small-btn span{
  display:block;
  font-size:19px;
  margin-bottom:3px;
}

.logo{
  text-align:center;
  margin:10px 0;
}

.logo .welcome{
  font-size:10px;
  color:#ffe45c;
}

.logo h1{
  font-size:34px;
  color:#26dfff;
  text-shadow:0 0 12px #00c8ff;
}

.tag{
  display:inline-block;
  background:#ff4c5b;
  border-radius:15px;
  padding:4px 15px;
  font-size:10px;
}

.game-zone{
  margin:10px 0;
  height:130px;
  border:2px solid #20cfff;
  border-radius:18px;
  background:linear-gradient(135deg,#155fc9,#13368c);
  display:flex;
  justify-content:center;
  align-items:center;
  position:relative;
  overflow:hidden;
}

.game-zone .person{
  position:absolute;
  bottom:-8px;
  font-size:65px;
}

.person.left{
  left:20px;
}

.person.right{
  right:20px;
}

.zone-title{
  text-align:center;
  z-index:2;
}

.zone-title .dice{
  font-size:35px;
}

.zone-title h2{
  color:#ffd52b;
  font-size:21px;
}

.mode-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:7px;
}

.mode{
  padding:14px 8px;
  border-radius:14px;
  color:white;
  text-align:left;
  border:2px solid #55aaff;
  box-shadow:0 4px 10px #06143f;
}

.mode.online{
  background:linear-gradient(135deg,#00b95a,#00d86a);
}

.mode.friends{
  background:linear-gradient(135deg,#1263e9,#2468ff);
}

.mode.computer{
  background:linear-gradient(135deg,#ff7900,#ff9c00);
}

.mode.pass{
  background:linear-gradient(135deg,#7c18dc,#9c28ef);
}

.mode b{
  display:block;
  font-size:13px;
}

.mode small{
  font-size:9px;
}

.section-title{
  margin:12px 4px 6px;
  font-size:14px;
}

.games{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:7px;
}

.game{
  height:100px;
  border-radius:16px;
  color:white;
  border:2px solid #ffd72b;
  box-shadow:0 5px 10px #08123c;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
}

.game .icon{
  font-size:42px;
}

.game b{
  font-size:13px;
}

.ludo{
  background:linear-gradient(#f52e4b,#9c102b);
}

.snake{
  background:linear-gradient(#15c961,#087b38);
}

.carrom{
  background:linear-gradient(#c48726,#70430d);
}

.features{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:7px;
  margin-top:8px;
}

.feature{
  height:64px;
  background:linear-gradient(#173e94,#102a72);
  border:1px solid #239cff;
  border-radius:12px;
  color:white;
  font-size:9px;
}

.feature span{
  display:block;
  font-size:23px;
}

.rewards{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:7px;
  margin-top:8px;
}

.reward{
  padding:12px;
  border-radius:14px;
  border:2px solid #ffd52a;
}

.reward.daily{
  background:linear-gradient(135deg,#d51e35,#a30d1f);
}

.reward.spin{
  background:linear-gradient(135deg,#6231e8,#8b20e8);
}

.reward button{
  margin-top:7px;
  padding:7px 12px;
  border-radius:15px;
  background:#ffd52b;
}

.bottom-nav{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  height:58px;
  background:#031338;
  border-top:2px solid #148cff;
  display:grid;
  grid-template-columns:repeat(5,1fr);
  max-width:620px;
  margin:auto;
  z-index:20;
}

.bottom-nav button{
  background:none;
  color:white;
  font-size:9px;
}

.bottom-nav span{
  display:block;
  font-size:20px;
}

/* LUDO */

.ludo-screen{
  max-width:620px;
  margin:auto;
  min-height:100vh;
  padding:10px;
  background:linear-gradient(160deg,#071b55,#24147b);
}

.ludo-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:10px;
}

.back{
  background:#18378d;
  color:white;
  padding:8px 13px;
  border-radius:12px;
  border:1px solid #38c8ff;
}

.turn{
  background:#ffd329;
  color:#111;
  padding:8px 14px;
  border-radius:15px;
  font-size:12px;
}

.board-wrap{
  width:min(94vw,500px);
  aspect-ratio:1;
  margin:auto;
  background:white;
  padding:4px;
  border-radius:10px;
  box-shadow:0 0 25px #00aaff;
}

.board{
  width:100%;
  height:100%;
  display:grid;
  grid-template-columns:repeat(15,1fr);
  grid-template-rows:repeat(15,1fr);
  border:2px solid #111;
  background:#fff;
}

.cell{
  border:1px solid #aaa;
  position:relative;
}

.red{
  background:#ef334c;
}

.green{
  background:#22c96b;
}

.blue{
  background:#3498ee;
}

.yellow{
  background:#ffd83d;
}

.path{
  background:#fff;
}

.center{
  background:conic-gradient(
    #ef334c 0 25%,
    #22c96b 25% 50%,
    #ffd83d 50% 75%,
    #3498ee 75% 100%
  );
}

.home-area{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  grid-template-rows:repeat(2,1fr);
  padding:5px;
  gap:5px;
}

.home-dot{
  background:white;
  border-radius:50%;
  border:2px solid #555;
}

.piece{
  position:absolute;
  width:70%;
  height:70%;
  border-radius:50%;
  left:15%;
  top:15%;
  border:2px solid white;
  box-shadow:0 2px 4px #333;
  z-index:5;
}

.piece.red-piece{
  background:#d71935;
}

.piece.green-piece{
  background:#0caa4e;
}

.piece.blue-piece{
  background:#187bd0;
}

.piece.yellow-piece{
  background:#e9ad00;
}

.ludo-controls{
  margin-top:12px;
  text-align:center;
}

.dice-box{
  width:70px;
  height:70px;
  background:white;
  color:#111;
  border-radius:15px;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:40px;
  margin:auto;
  box-shadow:0 5px 12px #0008;
}

.roll{
  margin-top:10px;
  padding:13px 30px;
  border-radius:25px;
  background:linear-gradient(#ffd83a,#ff9d00);
  color:#111;
  font-size:15px;
}

.message{
  margin-top:8px;
  font-size:12px;
  color:#ddd;
}

.player-list{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:6px;
  margin-top:10px;
}

.player{
  padding:8px;
  border-radius:10px;
  text-align:center;
  background:#172d77;
  border:1px solid #338eff;
  font-size:11px;
}

.player.active{
  border:2px solid #ffd72b;
  box-shadow:0 0 10px #ffd72b;
}

/* RESPONSIVE */

@media(max-width:400px){
  .top-menu{
    grid-template-columns:repeat(3,1fr);
  }

  .logo h1{
    font-size:29px;
  }

  .game{
    height:90px;
  }

  .game .icon{
    font-size:35px;
  }
}
</style>
</head>

<script>

let currentPlayer = 0;
let rolling = false;

const players = [
  {name:"Red",emoji:"🔴"},
  {name:"Green",emoji:"🟢"},
  {name:"Yellow",emoji:"🟡"},
  {name:"Blue",emoji:"🔵"}
];

const diceFaces = [
  "⚀","⚁","⚂","⚃","⚄","⚅"
];

function openLudo(){

  document.getElementById("homeScreen")
    .classList.add("hidden");

  document.getElementById("ludoScreen")
    .classList.remove("hidden");

  window.scrollTo(0,0);

}

function closeLudo(){

  document.getElementById("ludoScreen")
    .classList.add("hidden");

  document.getElementById("homeScreen")
    .classList.remove("hidden");

  window.scrollTo(0,0);

}

function rollDice(){

  if(rolling) return;

  rolling=true;

  const dice=document.getElementById("dice");
  const message=document.getElementById("message");

  let count=0;

  const animation=setInterval(()=>{

    const random=Math.floor(Math.random()*6);

    dice.textContent=diceFaces[random];

    count++;

    if(count>=10){

      clearInterval(animation);

      const value=Math.floor(Math.random()*6)+1;

      dice.textContent=diceFaces[value-1];

      message.textContent=
        players[currentPlayer].emoji+" "+
        players[currentPlayer].name+
        " rolled "+value+"!";

      rolling=false;

      if(value!==6){

        setTimeout(nextTurn,900);

      }else{

        message.textContent +=
          " 🎉 Roll again!";

      }

    }

  },100);

}

function nextTurn(){

  currentPlayer++;

  if(currentPlayer>=players.length){
    currentPlayer=0;
  }

  document.querySelectorAll(".player")
    .forEach(p=>p.classList.remove("active"));

  document.getElementById("p"+currentPlayer)
    .classList.add("active");

  const p=players[currentPlayer];

  document.getElementById("turnText")
    .textContent=p.emoji+" "+p.name+" Turn";

  document.getElementById("message")
    .textContent=
    p.emoji+" "+p.name+
    " player: Roll the dice.";

}

</script>
